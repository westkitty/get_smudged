name: Process Smudge archive

on:
  push:
    branches:
      - smudge-assets
    paths:
      - Archive.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the asset branch
        uses: actions/checkout@v4
        with:
          ref: smudge-assets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Rename and optimize the images
        run: python tools/process_assets.py

      - name: Commit generated assets
        run: |
          rm -f Archive.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add optimized Smudge and Dexter assets"
          git push origin smudge-assets
