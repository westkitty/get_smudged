name: Enable CSS-only Smudge lottery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/enable_css_lottery.py"
      - ".github/workflows/enable-css-lottery.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Build poster lottery and update CSS
        run: python tools/enable_css_lottery.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          css = Path("jellyfin-smudged.css").read_text(encoding="utf-8")
          sprite = Path("assets/poster-lottery.webp")

          assert css.count("{") == css.count("}"), "Unbalanced CSS braces"
          assert css.count("assets/poster-lottery.webp") == 1
          assert "pointer-events: none" in css
          assert sprite.is_file(), "Poster lottery sprite is missing"

          image = Image.open(sprite).convert("RGBA")
          assert image.size == (8000, 160), image.size
          assert image.getchannel("A").getextrema()[0] < 255, "Transparency is missing"

          ambient = css.split("/* Poster Smudging", 1)[0]
          assert "assets/dexter/" not in ambient
          print("CSS-only lottery validation passed")
          PY

      - name: Commit completed lottery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin-smudged.css README.md assets/poster-lottery.webp
          if git diff --cached --quiet; then
            echo "Lottery is already current."
          else
            git commit -m "Enable CSS-only one-in-fifty Dexter lottery"
            git push
          fi
